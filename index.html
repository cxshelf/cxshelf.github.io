<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   cx — design tokens
   Outfit: a geometric, rounded-terminal sans that echoes the cx
   mark's pill-shaped "c" and monoline "x" — used for the wordmark,
   headlines and numerals, at confident weight rather than as a
   pixel novelty face.
   Plus Jakarta Sans: a warmer, slightly humanist workhorse for
   body and UI text, paired to feel premium rather than default.
   ============================================================ */
:root{
  --bg:#0A0A0B; --bg-2:#0F0F11; --surface:#161618; --surface-2:#1E1E21; --raised:#232326;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.14);
  --ink:#F3F3F1; --ink-2:#B9B9BE; --ink-3:#7C7C82; --ink-4:#4C4C51;
  --orange-1:#E0895A; --orange-2:#C9683F; --orange-3:#EFB98F;
  --grad-brand: linear-gradient(135deg, var(--orange-3) 0%, var(--orange-1) 48%, #A85333 100%);
  --grad-fade: linear-gradient(180deg, transparent, var(--bg));
  --good:#3DDC84; --gold:#E8B96A;
  --r-lg:24px; --r-md:18px; --r-sm:11px; --r-pill:999px;
  --sh:0 10px 30px rgba(0,0,0,.5);
  --sh-orange:0 10px 30px rgba(201,104,63,.30);
  --ease:cubic-bezier(.22,.9,.25,1);
  --dur-fast:.16s; --dur:.32s; --dur-slow:.52s;
  --font-display:"Outfit", ui-sans-serif, system-ui, sans-serif;
  --font-body:"Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  --nav-h:66px; --nav-gap:16px; --rail-w:0px;
}
:root[data-theme="light"]{
  --bg:#F2F1EE; --bg-2:#EAE9E4; --surface:#FFFFFF; --surface-2:#F4F3EF; --raised:#FFFFFF;
  --line:rgba(10,10,11,.10); --line-2:rgba(10,10,11,.16);
  --ink:#131313; --ink-2:#4B4B4E; --ink-3:#83837E; --ink-4:#AFAFA9;
  --grad-fade: linear-gradient(180deg, transparent, var(--bg));
  --sh:0 10px 28px rgba(20,15,10,.14);
  --sh-orange:0 8px 22px rgba(168,83,51,.20);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  font-size:15.5px;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--orange-1);outline-offset:3px;border-radius:4px}
img,svg{display:block;max-width:100%}
.ico{width:1.2em;height:1.2em;flex:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
::selection{background:var(--orange-2);color:#fff}

/* scrollbars, thin & dark */
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ── wordmark ── */
.wordmark{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.03em;line-height:1;
  background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent;
  display:inline-block;padding:2px 0}
.wordmark.lg{font-size:40px}

/* ============================================================
   NAV — a single floating pill, detached from the page edge so
   the hero's glow can bleed past its rounded ends rather than
   stopping dead at a full-width bar. No profile control anywhere.
   ============================================================ */
.topbar{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:18px;width:min(920px, calc(100% - 32px));
  height:var(--nav-h);padding:0 10px 0 22px;border-radius:var(--r-pill);
  background:var(--glass, rgba(22,22,24,.66));
  backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 14px 36px rgba(0,0,0,.35);
}
:root[data-theme="light"] .topbar{background:rgba(255,255,255,.72);border-color:rgba(10,10,11,.07);
  box-shadow:0 14px 30px rgba(20,15,10,.12)}
.topbar .links{display:flex;align-items:center;gap:2px;flex:1}
.topbar .links a{
  padding:9px 16px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--ink-3);
  transition:color var(--dur-fast),background var(--dur-fast)
}
.topbar .links a:hover{color:var(--ink)}
.topbar .links a.on{color:var(--ink);background:var(--raised)}
.searchwrap{position:relative;width:min(260px,26vw)}
.searchwrap .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.searchwrap input{
  width:100%;height:40px;padding:0 14px 0 40px;border-radius:var(--r-pill);border:1px solid var(--line);
  background:var(--surface);font-size:14px;transition:border-color var(--dur-fast),background var(--dur-fast)
}
.searchwrap input:focus{outline:0;border-color:var(--orange-1);background:var(--raised)}
.icobtn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none;
  transition:transform var(--dur-fast) var(--ease),border-color var(--dur-fast),color var(--dur-fast),background var(--dur-fast)
}
.icobtn:hover{color:var(--ink);border-color:var(--line-2)}
.icobtn:active{transform:scale(.92)}
.icobtn.brand{background:var(--grad-brand);border:0;color:#2A1206}

/* mobile floating cluster (image-1 layout: 3 circles top-left) */
.cluster{
  position:fixed;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:50;
  display:none;gap:9px;
}
.cluster .icobtn{background:rgba(22,22,24,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-color:rgba(255,255,255,.12)}
:root[data-theme="light"] .cluster .icobtn{background:rgba(255,255,255,.78);border-color:rgba(0,0,0,.08)}

/* mobile bottom nav — also a detached floating pill, not an edge-to-edge bar */
.bottomnav{
  position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:50;display:none;gap:2px;padding:6px;border-radius:var(--r-pill);
  background:rgba(22,22,24,.72);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 30px rgba(0,0,0,.4);
}
:root[data-theme="light"] .bottomnav{background:rgba(255,255,255,.82);border-color:rgba(10,10,11,.07);
  box-shadow:0 12px 26px rgba(20,15,10,.14)}
.bottomnav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--ink-3);
  cursor:pointer;font-size:10.5px;font-weight:600;padding:8px 18px;border-radius:var(--r-pill);
  transition:color var(--dur-fast),background var(--dur-fast)
}
.bottomnav button.on{color:var(--orange-1);background:rgba(224,137,90,.14)}
.bottomnav button .ico{width:21px;height:21px}

@media (max-width: 880px){
  .topbar{display:none}
  .cluster{display:flex}
  .bottomnav{display:flex}
  body{padding-bottom:0}
}

/* ============================================================
   HERO — starts at the true top of the page (the nav floats over
   it, out of flow) so the glow reaches y:0 and bleeds past the
   pill's rounded ends instead of being sliced by an opaque bar.
   ============================================================ */
.hero{
  position:relative;overflow:hidden;
  padding:calc(var(--nav-h) + var(--nav-gap) + 40px) clamp(18px,4vw,44px) 40px;
}
.hero::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(58% 64% at 88% -6%, rgba(201,104,63,.30), transparent 72%),
    radial-gradient(46% 54% at 8% -4%, rgba(224,137,90,.16), transparent 68%);
}
@media (max-width: 880px){
  .hero{ padding-top:calc(56px + env(safe-area-inset-top) + 34px) }
}
.hero h1{
  font-family:var(--font-display);font-size:clamp(30px,4.6vw,52px);line-height:1.08;letter-spacing:.01em;
  margin:0 0 14px;max-width:16ch
}
.hero p{margin:0;color:var(--ink-2);font-size:16px;max-width:52ch;line-height:1.6}
.hero .stat-row{display:flex;gap:28px;margin-top:26px;flex-wrap:wrap}
.hero .stat b{font-family:var(--font-display);font-size:22px;display:block;color:var(--orange-1)}
.hero .stat span{font-size:12.5px;color:var(--ink-3)}

/* ============================================================
   ROWS / SHELVES
   ============================================================ */
.shelf{padding:26px clamp(18px,4vw,44px) 6px}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:14px}
.shelf-head h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:9px}
.shelf-head h2 .ico{width:18px;height:18px;color:var(--orange-1)}
.shelf-head .count{font-size:12.5px;color:var(--ink-4);font-weight:500}
.shelf-scroll{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 18px;scroll-snap-type:x proximity}
.shelf-scroll::-webkit-scrollbar{display:none}

/* ============================================================
   TILE — hover slide/peel effect (from the Canva reference:
   a duplicate offset behind the card, sliding to align on hover)
   ============================================================ */
.tile{
  position:relative;flex:0 0 216px;scroll-snap-align:start;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.tile .stackshadow{
  position:absolute;inset:0;border-radius:var(--r-md);background:var(--grad-brand);
  transform:translate(10px,10px);opacity:0;
  transition:transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
  z-index:0;
}
.tile .art{
  position:relative;z-index:1;aspect-ratio:3/4;border-radius:var(--r-md);overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line);
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  display:flex;flex-direction:column;justify-content:flex-end;
}
.tile:hover .art, .tile:focus-visible .art{
  transform:translate(-6px,-6px);border-color:transparent;box-shadow:var(--sh-orange);
}
.tile:hover .stackshadow, .tile:focus-visible .stackshadow{opacity:.9;transform:translate(4px,4px)}
.tile .art .bg{position:absolute;inset:0;z-index:0}
.tile .art .fade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.82) 100%)}
.tile .art .mark{position:absolute;inset:0;z-index:0;display:grid;place-items:center;font-family:var(--font-display);
  font-size:15px;color:rgba(255,255,255,.16);letter-spacing:.06em;padding:12px;text-align:center;line-height:1.5}
.tile .art .body{position:relative;z-index:2;padding:12px}
.tile .art .body b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;color:#fff;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .art .body span{font-size:11.5px;color:rgba(255,255,255,.68)}
.tile .badge{
  position:absolute;top:9px;left:9px;z-index:3;padding:4px 9px;border-radius:var(--r-pill);
  font-size:10px;font-weight:700;letter-spacing:.03em;color:#1A0800;background:var(--gold)
}
.tile .badge.up{background:#8FD1FF;color:#052235}
.tile .badge.new{background:var(--good);color:#052012}
.tile .badge.sub{background:#fff;color:#1A0800}
.tile .fav-dot{
  position:absolute;top:9px;right:9px;z-index:3;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;
  opacity:0;transform:scale(.7);transition:opacity var(--dur-fast),transform var(--dur-fast) var(--ease)
}
.tile:hover .fav-dot{opacity:1;transform:scale(1)}
.tile .fav-dot.on{opacity:1;transform:scale(1);color:var(--orange-1)}
.tile .fav-dot .ico{width:14px;height:14px}

.shelf.empty-guard:empty{display:none}

/* ============================================================
   DETAIL SCREEN — opens from a tile with a scale/origin transition
   ============================================================ */
.veil{position:fixed;inset:0;z-index:90;background:rgba(6,4,3,.7);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease)}
.veil.on{opacity:1;pointer-events:auto}

.detail{
  position:fixed;z-index:91;inset:0;overflow-y:auto;background:var(--bg);
  transform:scale(.92) translateY(28px);opacity:0;pointer-events:none;
  transition:transform var(--dur-slow) var(--ease), opacity var(--dur) var(--ease);
  transform-origin:var(--origin-x,50%) var(--origin-y,50%);
}
.detail.on{transform:none;opacity:1;pointer-events:auto}
.detail .banner{position:relative;height:min(52vh,460px);overflow:hidden}
.detail .banner .bg{position:absolute;inset:0}
.detail .banner .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%, var(--bg) 96%)}
.detail .close{
  position:absolute;top:calc(18px + env(safe-area-inset-top));right:18px;z-index:4;
  width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  border:0;color:#fff;display:grid;place-items:center;cursor:pointer
}
.detail .head-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 clamp(18px,4vw,54px) 22px}
.detail .badges{display:flex;gap:8px;margin-bottom:12px}
.detail h2{font-family:var(--font-display);font-size:clamp(26px,4.4vw,44px);margin:0 0 8px;line-height:1.1}
.detail .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-2);font-size:13.5px}
.detail .body{padding:26px clamp(18px,4vw,54px) 70px;max-width:900px}
.detail .body p{color:var(--ink-2);font-size:15.5px;line-height:1.7;max-width:68ch}
.detail .actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 30px}
.detail .platforms{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);
  background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 26px;
  border-radius:var(--r-pill);border:0;font-weight:700;font-size:15px;cursor:pointer;
  transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast), background var(--dur-fast), color var(--dur-fast);
}
.btn:active{transform:scale(.965)}
.btn .ico{width:19px;height:19px}
.btn.play{background:var(--grad-brand);color:#1A0800;box-shadow:var(--sh-orange)}
.btn.play:hover{box-shadow:0 12px 34px rgba(168,83,51,.42)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.ghost.active{color:var(--orange-1);border-color:rgba(224,137,90,.4);background:rgba(224,137,90,.1)}
.btn.icon{width:50px;padding:0}

/* ============================================================
   REDIRECT TRANSITION
   ============================================================ */
.redirect{
  position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity var(--dur-fast)
}
.redirect.on{opacity:1;pointer-events:auto}
.redirect .sweep{position:absolute;inset:0;background:var(--grad-brand);clip-path:circle(0% at 50% 50%);
  transition:clip-path var(--dur-slow) var(--ease)}
.redirect.on .sweep{clip-path:circle(150% at 50% 50%)}
.redirect .msg{position:relative;z-index:2;text-align:center;color:#1A0800;opacity:0;transition:opacity .2s ease .3s}
.redirect.on .msg{opacity:1}
.redirect .msg .wordmark{color:#1A0800;background:none;-webkit-text-fill-color:#1A0800}
.redirect .msg p{margin:10px 0 0;font-size:13.5px;font-weight:600}
.redirect .spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(26,8,0,.25);border-top-color:#1A0800;
  margin:16px auto 0;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:120;
  display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:var(--r-pill);
  background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--sh);font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease)
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .ico{width:16px;height:16px;color:var(--orange-1)}

.footer{padding:50px clamp(18px,4vw,44px) 40px;color:var(--ink-4);font-size:12.5px;display:flex;justify-content:space-between;
  flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);margin-top:30px}
</style>
</head>

<script>
"use strict";
/* ============================================================
   cx — data model
   Every game is a plain object with boolean flags the shelves
   are built from. Add a game here and it's automatically routed
   into whichever shelves its flags match.
   ============================================================ */
const GAMES = [
  { id:"g01", title:"Ridgeline Drift", tagline:"Arcade racing", desc:"Sideways through canyon switchbacks at speeds the car was never rated for. Fourteen tracks, no rubber-banding, no apologies.", url:"https://example.com/ridgeline-drift", tags:["Racing","Arcade"], platforms:["PC","PlayStation","Xbox"], hue:[18,100,54], isPopular:true, isUpcoming:false, isNew:false, isSubscribersOnly:false },

  { id:"g03", title:"Copper & Rust", tagline:"Base builder", desc:"Strip a dead moon for parts, one refinery at a time, while something in the deep tunnels keeps rearranging the ore you already mapped.", url:"https://example.com/copper-and-rust", tags:["Strategy","Building"], platforms:["PC"], hue:[24,70,48], isPopular:false, isUpcoming:true, isNew:false, isSubscribersOnly:false },
  { id:"g04", title:"Ninefold Blade", tagline:"Action RPG", desc:"Nine weapons, nine endings, one very short window to figure out which one you're actually holding when the boss doors lock.", url:"https://example.com/ninefold-blade", tags:["RPG","Action"], platforms:["PC","Xbox","Switch"], hue:[0,72,46], isPopular:true, isUpcoming:false, isNew:false, isSubscribersOnly:true },
  { id:"g05", title:"Undertow", tagline:"Survival co-op", desc:"A flooded coastline, four fishing boats, and a tide that comes in twice as fast as the forecast says it should.", url:"https://example.com/undertow", tags:["Survival","Co-op"], platforms:["PC","PlayStation"], hue:[200,65,40], isPopular:false, isUpcoming:false, isNew:true, isSubscribersOnly:false },
  { id:"g06", title:"Marrow County", tagline:"Open world", desc:"A county the size of a small state, a truck that starts most mornings, and a rumor about what's actually underneath the quarry.", url:"https://example.com/marrow-county", tags:["Open World","Adventure"], platforms:["PC","Xbox"], hue:[30,55,42], isPopular:true, isUpcoming:false, isNew:false, isSubscribersOnly:false },
  { id:"g07", title:"Static Choir", tagline:"Puzzle", desc:"Every puzzle is a chord. Get the voicing wrong and the room remembers — literally, the walls redraw around your last mistake.", url:"https://example.com/static-choir", tags:["Puzzle","Music"], platforms:["PC","Switch"], hue:[280,45,52], isPopular:false, isUpcoming:true, isNew:false, isSubscribersOnly:false },
  { id:"g08", title:"Longshore Kings", tagline:"Sports sim", desc:"Run a dockside fishing league across nine seasons, where your best captain retiring mid-year matters more than any single catch.", url:"https://example.com/longshore-kings", tags:["Sports","Sim"], platforms:["PC","PlayStation","Xbox"], hue:[12,80,50], isPopular:false, isUpcoming:false, isNew:false, isSubscribersOnly:true },
  { id:"g09", title:"Ashgrove", tagline:"Roguelike deckbuilder", desc:"Every run burns the forest down a little more. Eventually there's nothing left to hide in, which was rather the point.", url:"https://example.com/ashgrove", tags:["Roguelike","Cards"], platforms:["PC","Switch"], hue:[8,68,42], isPopular:true, isUpcoming:false, isNew:false, isSubscribersOnly:false },
  { id:"g10", title:"Payload Zero", tagline:"Tactical shooter", desc:"Six-person squads, one shared radio channel, and a scoring system that punishes anyone who fires before the countdown hits zero.", url:"https://example.com/payload-zero", tags:["Shooter","Tactical"], platforms:["PC","Xbox"], hue:[210,20,32], isPopular:true, isUpcoming:false, isNew:false, isSubscribersOnly:false },

  { id:"g12", title:"Ironclad Ledger", tagline:"Trading strategy", desc:"Run a merchant fleet through three warring ports without ever technically taking a side — a promise that gets harder every season.", url:"https://example.com/ironclad-ledger", tags:["Strategy","Trading"], platforms:["PC"], hue:[45,60,42], isPopular:false, isUpcoming:true, isNew:false, isSubscribersOnly:true },
  { id:"g13", title:"Fen & Fable", tagline:"Cozy sim", desc:"A swamp cottage, a leaky roof, and neighbors who are all, technically, folklore made flesh and mildly annoyed about the leak too.", url:"https://example.com/fen-and-fable", tags:["Cozy","Sim"], platforms:["PC","Switch"], hue:[150,40,42], isPopular:false, isUpcoming:false, isNew:true, isSubscribersOnly:false },
  { id:"g14", title:"Deadhand", tagline:"Western shooter", desc:"A bounty board that updates in real time, a revolver that jams if you clean it wrong, and a town that remembers exactly who you shot.", url:"https://example.com/deadhand", tags:["Western","Shooter"], platforms:["PC","PlayStation"], hue:[22,62,38], isPopular:true, isUpcoming:false, isNew:false, isSubscribersOnly:false }
];

/* ============================================================
   storage — everything here caches in the browser only
   ============================================================ */
const STORE_KEY = "cx:state:v1";
function loadState(){
  try { return Object.assign({ favorites:[], playlist:[], recent:[], theme:null }, JSON.parse(localStorage.getItem(STORE_KEY) || "{}")); }
  catch(e){ return { favorites:[], playlist:[], recent:[], theme:null }; }
}
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} }
let state = loadState();

function byId(id){ return GAMES.find(g => g.id === id); }
function toggleSet(key, id){
  const i = state[key].indexOf(id);
  if (i === -1) state[key].push(id); else state[key].splice(i, 1);
  saveState();
  return i === -1;
}
function pushRecent(id){
  state.recent = state.recent.filter(x => x !== id);
  state.recent.unshift(id);
  state.recent = state.recent.slice(0, 12);
  saveState();
}

/* ============================================================
   render helpers
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function el(tag, cls, txt){ const n = document.createElement(tag); if(cls) n.className = cls; if(txt != null) n.textContent = txt; return n; }
function icon(id){ const s = document.createElementNS("http://www.w3.org/2000/svg","svg"); s.setAttribute("class","ico"); const u = document.createElementNS("http://www.w3.org/2000/svg","use"); u.setAttribute("href","#"+id); s.appendChild(u); return s; }
function artGradient(hue){
  const [h,s,l] = hue;
  return `linear-gradient(150deg, hsl(${h} ${s}% ${Math.min(l+18,70)}%), hsl(${h} ${Math.max(s-8,10)}% ${Math.max(l-16,8)}%) 70%)`;
}
function initials(title){ return title.split(" ").map(w=>w[0]).join("").slice(0,3).toUpperCase(); }

function tileNode(game){
  const t = el("article","tile");
  t.tabIndex = 0; t.dataset.id = game.id;
  const shadow = el("div","stackshadow");
  const art = el("div","art");
  const bg = el("div","bg"); bg.style.background = artGradient(game.hue);
  const mark = el("div","mark", initials(game.title));
  const fade = el("div","fade");
  const body = el("div","body");
  body.append(el("b",null,game.title), el("span",null,game.tagline));
  art.append(bg, mark, fade, body);

  if (game.isNew) art.appendChild(Object.assign(el("span","badge new","New")));
  else if (game.isUpcoming) art.appendChild(Object.assign(el("span","badge up","Coming soon")));
  else if (game.isSubscribersOnly) art.appendChild(Object.assign(el("span","badge sub","Subscribers")));
  else if (game.isPopular) art.appendChild(Object.assign(el("span","badge","Popular")));

  const fav = el("button","fav-dot" + (state.favorites.includes(game.id) ? " on" : ""));
  fav.setAttribute("aria-label","Toggle favorite");
  fav.appendChild(icon(state.favorites.includes(game.id) ? "i-heart-fill" : "i-heart"));
  fav.addEventListener("click", (e) => {
    e.stopPropagation();
    const on = toggleSet("favorites", game.id);
    fav.classList.toggle("on", on);
    fav.innerHTML = ""; fav.appendChild(icon(on ? "i-heart-fill" : "i-heart"));
    toast(on ? "Added to favorites" : "Removed from favorites");
    if (state.route === "favorites") renderRoute();
  });

  t.append(shadow, art, fav);
  t.addEventListener("click", () => openDetail(game, t));
  t.addEventListener("keydown", (e) => { if (e.key === "Enter") openDetail(game, t); });
  return t;
}

function shelf(title, iconId, games, opts){
  if (!games.length) return null;
  const wrap = el("section","shelf empty-guard");
  const head = el("div","shelf-head");
  const h2 = el("h2"); h2.append(icon(iconId), document.createTextNode(title));
  head.append(h2, el("span","count", games.length + " title" + (games.length===1?"":"s")));
  const scroll = el("div","shelf-scroll");
  games.forEach(g => scroll.appendChild(tileNode(g)));
  wrap.append(head, scroll);
  return wrap;
}

/* ============================================================
   routing — home / favorites / playlist, all client-side
   ============================================================ */
state.route = "home";
function renderRoute(){
  const rows = $("#rows"); rows.innerHTML = "";
  $$(".hero").forEach(h => h.style.display = state.route === "home" ? "" : "none");
  $$("[data-nav]").forEach(n => n.classList.toggle("on", n.dataset.nav === state.route));

  let query = ($("#activeQuery") || {}).value || "";
  const pool = query ? GAMES.filter(g => g.title.toLowerCase().includes(query) || g.tags.some(t=>t.toLowerCase().includes(query))) : GAMES;

  if (query){
    const s = shelf("Results for \u201c" + query + "\u201d", "i-search", pool);
    rows.appendChild(s || emptyNote("Nothing matches that search."));
    return;
  }

  if (state.route === "favorites"){
    const games = state.favorites.map(byId).filter(Boolean);
    rows.appendChild(shelf("Your favorites", "i-heart", games) || emptyNote("No favorites yet. Tap the heart on any tile to add one."));
    return;
  }
  if (state.route === "playlist"){
    const games = state.playlist.map(byId).filter(Boolean);
    rows.appendChild(shelf("Your playlist", "i-list", games) || emptyNote("Your playlist is empty. Open a game and add it from there."));
    return;
  }

  // home: recent, favorites, playlist, then category shelves — each hidden if empty
  const recentGames = state.recent.map(byId).filter(Boolean);
  const favGames = state.favorites.map(byId).filter(Boolean);
  const listGames = state.playlist.map(byId).filter(Boolean);
  [
    shelf("Continue playing", "i-history", recentGames),
    shelf("Your favorites", "i-heart", favGames),
    shelf("Your playlist", "i-list", listGames),
    shelf("Popular now", "i-flame", GAMES.filter(g=>g.isPopular)),
    shelf("Up and coming", "i-clock", GAMES.filter(g=>g.isUpcoming)),
    shelf("New releases", "i-new", GAMES.filter(g=>g.isNew)),
    shelf("Subscribers only", "i-lock", GAMES.filter(g=>g.isSubscribersOnly)),
  ].filter(Boolean).forEach(s => rows.appendChild(s));

  renderHeroStats();
}
function emptyNote(msg){
  const p = el("p", null, msg);
  p.style.cssText = "padding:60px clamp(18px,4vw,44px);color:var(--ink-3);font-size:15px;max-width:44ch";
  return p;
}
function renderHeroStats(){
  const wrap = $("#heroStats"); wrap.innerHTML = "";
  const stats = [
    [GAMES.length, "games on the shelf"],
    [state.favorites.length, "in your favorites"],
    [state.playlist.length, "in your playlist"]
  ];
  stats.forEach(([n,l]) => { const d = el("div","stat"); d.append(el("b",null,String(n)), el("span",null,l)); wrap.appendChild(d); });
}

function goRoute(r){ state.route = r; const q = $("#searchInput"); if(q) q.value=""; const mq = $("#mobileSearchInput"); if(mq) mq.value=""; renderRoute(); window.scrollTo({top:0,behavior:"smooth"}); }
$$("[data-nav]").forEach(n => n.addEventListener("click", (e) => { e.preventDefault(); goRoute(n.dataset.nav); }));
$("#clusterHome").addEventListener("click", () => goRoute("home"));

/* ============================================================
   search (desktop inline + mobile toggle)
   ============================================================ */
function runSearch(v){
  const rows = $("#rows"); rows.innerHTML = "";
  const q = v.trim().toLowerCase();
  window.__q = q;
  $("#activeQuery", document.body) || null;
  const marker = { value: q };
  window.__activeQueryValue = q;
  renderRouteWithQuery(q);
}
function renderRouteWithQuery(q){
  const rows = $("#rows"); rows.innerHTML = "";
  if (!q){ renderRoute(); return; }
  $$(".hero").forEach(h => h.style.display = "none");
  const pool = GAMES.filter(g => g.title.toLowerCase().includes(q) || g.tags.some(t=>t.toLowerCase().includes(q)) || g.tagline.toLowerCase().includes(q));
  const s = shelf("Results for \u201c" + q + "\u201d", "i-search", pool);
  rows.appendChild(s || emptyNote("Nothing matches \u201c" + q + "\u201d."));
}
$("#searchInput").addEventListener("input", (e) => renderRouteWithQuery(e.target.value.toLowerCase()));
$("#mobileSearchInput").addEventListener("input", (e) => renderRouteWithQuery(e.target.value.toLowerCase()));
$("#clusterSearch").addEventListener("click", () => {
  const w = $("#mobileSearchWrap");
  const showing = w.style.display !== "none";
  w.style.display = showing ? "none" : "flex";
  if (!showing) setTimeout(() => $("#mobileSearchInput").focus(), 60);
  else runSearch("");
});

/* ============================================================
   detail screen — scale transition anchored at the clicked tile
   ============================================================ */
let currentGame = null;
function openDetail(game, tileEl){
  currentGame = game;
  const rect = tileEl.getBoundingClientRect();
  const ox = ((rect.left + rect.width/2) / innerWidth) * 100;
  const oy = ((rect.top + rect.height/2) / innerHeight) * 100;
  const d = $("#detail");
  d.style.setProperty("--origin-x", ox + "%");
  d.style.setProperty("--origin-y", oy + "%");

  $("#detailBg").style.background = artGradient(game.hue);
  $("#detailTitle").textContent = game.title;
  const badges = $("#detailBadges"); badges.innerHTML = "";
  [
    [game.isPopular,"Popular","badge"], [game.isUpcoming,"Coming soon","badge up"],
    [game.isNew,"New","badge new"], [game.isSubscribersOnly,"Subscribers only","badge sub"]
  ].forEach(([cond,label,cls]) => { if(cond){ const b = el("span",cls,label); b.style.position="static"; badges.appendChild(b); } });

  const meta = $("#detailMeta"); meta.innerHTML = "";
  meta.append(el("span",null,game.tagline), el("span",null,"\u00b7"), el("span",null,game.tags.join(", ")));
  $("#detailDesc").textContent = game.desc;

  const plat = $("#detailPlatforms"); plat.innerHTML = "";
  game.platforms.forEach(p => plat.appendChild(el("span","chip",p)));

  syncDetailButtons();

  $("#veil").classList.add("on");
  d.classList.add("on");
  document.body.style.overflow = "hidden";
  history.pushState({ cx:"detail" }, "", "#" + game.id);
}
function syncDetailButtons(){
  const favBtn = $("#detailFav"), listBtn = $("#detailList");
  const isFav = state.favorites.includes(currentGame.id);
  const isListed = state.playlist.includes(currentGame.id);
  favBtn.classList.toggle("active", isFav);
  favBtn.innerHTML = ""; favBtn.appendChild(icon(isFav ? "i-heart-fill" : "i-heart"));
  favBtn.append(document.createTextNode(isFav ? "Favorited" : "Favorite"));
  listBtn.classList.toggle("active", isListed);
  listBtn.innerHTML = ""; listBtn.appendChild(icon(isListed ? "i-check" : "i-plus"));
  listBtn.append(document.createTextNode(isListed ? "In playlist" : "Add to playlist"));
}
function closeDetail(){
  $("#veil").classList.remove("on");
  $("#detail").classList.remove("on");
  document.body.style.overflow = "";
  if (location.hash) history.back();
}
$("#detailClose").addEventListener("click", closeDetail);
$("#veil").addEventListener("click", closeDetail);
addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#detail").classList.contains("on")) closeDetail(); });
addEventListener("popstate", () => { if ($("#detail").classList.contains("on")) { $("#veil").classList.remove("on"); $("#detail").classList.remove("on"); document.body.style.overflow=""; } });

$("#detailFav").addEventListener("click", () => {
  const on = toggleSet("favorites", currentGame.id);
  syncDetailButtons();
  toast(on ? "Added to favorites" : "Removed from favorites");
});
$("#detailList").addEventListener("click", () => {
  const on = toggleSet("playlist", currentGame.id);
  syncDetailButtons();
  toast(on ? "Added to playlist" : "Removed from playlist");
});
$("#detailPlay").addEventListener("click", () => launch(currentGame));

/* ============================================================
   launch / redirect transition
   ============================================================ */
function launch(game){
  pushRecent(game.id);
  const r = $("#redirect");
  $("#redirectLabel").textContent = "Launching " + game.title + "\u2026";
  r.classList.add("on");
  setTimeout(() => {
    window.open(game.url, "_blank", "noopener");
    setTimeout(() => { r.classList.remove("on"); closeDetail(); renderRoute(); }, 260);
  }, 620);
}

/* ============================================================
   toast
   ============================================================ */
let toastT;
function toast(msg){
  const t = $("#toast");
  $("span", t).textContent = msg;
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("on"), 2200);
}

/* ============================================================
   theme — dark/light, auto-detect + manual override, cached
   ============================================================ */
function applyTheme(mode){
  document.documentElement.dataset.theme = mode;
  $$("#themeBtn .ico use, #clusterTheme .ico use").forEach(u => u.setAttribute("href", mode === "light" ? "#i-sun" : "#i-moon"));
  state.theme = mode; saveState();
}
function initTheme(){
  const preferred = state.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  applyTheme(preferred);
}
function toggleTheme(){
  applyTheme((document.documentElement.dataset.theme === "light") ? "dark" : "light");
}
$("#themeBtn").addEventListener("click", toggleTheme);
$("#clusterTheme").addEventListener("click", toggleTheme);

/* ============================================================
   desktop / mobile detection — coarse layout switch is CSS-driven
   (media query above); this only adjusts behaviors that CSS can't:
   hover vs tap reveal of the favorite dot on touch devices.
   ============================================================ */
const COARSE = matchMedia("(pointer: coarse)").matches;
if (COARSE){
  document.body.addEventListener("touchstart", (e) => {
    const t = e.target.closest(".tile");
    $$(".tile.touch-open").forEach(x => { if (x !== t) x.classList.remove("touch-open"); });
    if (t) t.classList.add("touch-open");
  }, { passive:true });
}
const style = document.createElement("style");
style.textContent = ".tile.touch-open .fav-dot{opacity:1;transform:scale(1)}";
document.head.appendChild(style);

/* ============================================================
   clock (small footer touch, cheap and honest — real local time)
   ============================================================ */
function tickClock(){
  $("#clockOut").textContent = new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
}
tickClock(); setInterval(tickClock, 30000);

/* ============================================================
   boot
   ============================================================ */
initTheme();
renderRoute();
</script>
</body>
</html>
